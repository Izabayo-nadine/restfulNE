openapi: 3.0.0
info:
  title: FEMS API Gateway — Microservices
  version: 2.0.0
  description: Full API via gateway at http://localhost:5000/api/v1
servers:
  - url: http://localhost:5000/api/v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
paths:
  /auth/register:
    post:
      tags: [Authentication]
      security: []
      summary: Register user
  /auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Login (returns JWT)
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout
  /auth/profile:
    get:
      tags: [Authentication]
      summary: Get profile
    patch:
      tags: [Authentication]
      summary: Update profile
  /auth/change-password:
    patch:
      tags: [Authentication]
      summary: Change password
  /auth/users:
    get:
      tags: [Authentication]
      summary: List users (admin)
  /extinguishers:
    get:
      tags: [Fire Extinguishers]
      summary: List extinguishers
    post:
      tags: [Fire Extinguishers]
      summary: Create extinguisher
  /extinguishers/{id}:
    get:
      tags: [Fire Extinguishers]
      summary: Get by ID
    patch:
      tags: [Fire Extinguishers]
      summary: Update
    delete:
      tags: [Fire Extinguishers]
      summary: Delete (admin)
  /inspections:
    get:
      tags: [Inspections]
      summary: List inspections
    post:
      tags: [Inspections]
      summary: Schedule inspection
  /inspections/{id}/complete:
    patch:
      tags: [Inspections]
      summary: Complete inspection
  /maintenance:
    get:
      tags: [Maintenance]
      summary: List maintenance
    post:
      tags: [Maintenance]
      summary: Log maintenance
  /reports/inventory:
    get:
      tags: [Reports]
      summary: Inventory report
  /reports/inspections:
    get:
      tags: [Reports]
      summary: Inspection report
  /reports/compliance:
    get:
      tags: [Reports]
      summary: Compliance report
  /reports/maintenance:
    get:
      tags: [Reports]
      summary: Maintenance report
  /reports/export:
    get:
      tags: [Reports]
      summary: Export PDF or CSV
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications
